name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start Juice Shop
      run: docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
    - name: Wait for Juice Shop to be ready
      run: |
        for i in {1..60}; do
          if curl -fsS http://localhost:3000 > /dev/null; then
            echo "Juice Shop is up"
            exit 0
          fi
          echo "Waiting for Juice Shop..."
          sleep 2
        done
        echo "Juice Shop did not become ready in time"
        docker logs juice-shop
        exit 1
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Cleanup Juice Shop container
      if: ${{ always() }}
      run: docker rm -f juice-shop || true
